name: weather_planner
description: A weather-aware calendar planner app.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.0

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Storage
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  table_calendar: ^3.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utils
  intl: ^0.19.0
  permission_handler: ^11.3.0
  uuid: ^4.4.0
  share_plus: ^10.0.0
  home_widget: 0.9.1
  workmanager: ^0.9.0+3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0d0d14"  # navy bg color
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
